name: Deploy no GitHub Pages

on:
  # Sobe o site a cada push na branch principal
  push:
    branches: [main]
  # Permite rodar manualmente pela aba "Actions"
  workflow_dispatch:

# Permissões que o job de deploy precisa
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; cancela o anterior se um novo começar
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # base = "/<nome-do-repo>/" — calculado automaticamente.
          # Com domínio próprio (CNAME), troque a linha abaixo por:  VITE_BASE: /
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Empacotar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
